name: Validate Printer Fleet Controller v0.12.2

on:
  push:
    branches:
      - feature/batch-reprint-v0122

permissions:
  contents: write

jobs:
  test-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/batch-reprint-v0122
          fetch-depth: 0

      - name: Apply v0.12.2 batch reprint update
        run: python .github/pfc-v0122-batch-reprint.py

      - name: Run full test suite
        working-directory: print-farm-controller
        run: npm test

      - name: Commit tested v0.12.2 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pfc-v0122-batch-reprint.yml .github/pfc-v0122-batch-reprint.py
          git add print-farm-controller
          git commit -m "Add production batch reprint"
          git push origin HEAD:feature/batch-reprint-v0122
