name: Validate Printer Fleet Controller v0.12.1

on:
  push:
    branches:
      - feature/cancelled-history-reprint-test-v0121

permissions:
  contents: write

jobs:
  test-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cancelled-history-reprint-test-v0121
          fetch-depth: 0

      - name: Apply v0.12.1 regression update
        run: python .github/pfc-v0121-regression.py

      - name: Run full test suite
        working-directory: print-farm-controller
        run: npm test

      - name: Commit tested v0.12.1 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pfc-v0121-regression.yml .github/pfc-v0121-regression.py
          git add print-farm-controller
          git commit -m "Add cancelled history reprint regression coverage"
          git push origin HEAD:feature/cancelled-history-reprint-test-v0121
