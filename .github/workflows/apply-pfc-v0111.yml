name: Apply Printer Fleet Controller v0.11.1

on:
  push:
    branches:
      - feature/flashforge-nozzle-designation
    paths:
      - .pfc-update/READY

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/flashforge-nozzle-designation
          fetch-depth: 0

      - name: Apply nozzle designation update
        run: python .pfc-update/run-nozzle-v2.py

      - name: Run Printer Fleet Controller tests
        working-directory: print-farm-controller
        run: npm test

      - name: Commit v0.11.1 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .pfc-update
          git add print-farm-controller
          git commit -m "Add FlashForge nozzle designation v0.11.1"
          git push origin HEAD:feature/flashforge-nozzle-designation
