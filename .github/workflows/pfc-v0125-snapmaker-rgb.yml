name: Validate Printer Fleet Controller v0.12.5

on:
  push:
    branches:
      - feature/snapmaker-rgb-display-v0125

permissions:
  contents: write

jobs:
  test-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/snapmaker-rgb-display-v0125
          fetch-depth: 0

      - name: Apply v0.12.5 Snapmaker RGB display update
        run: python .github/pfc-v0125-snapmaker-rgb.py

      - name: Run full test suite
        working-directory: print-farm-controller
        run: npm test

      - name: Commit tested v0.12.5 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pfc-v0125-snapmaker-rgb.yml .github/pfc-v0125-snapmaker-rgb.py
          git add print-farm-controller
          git commit -m "Show Snapmaker filament colours in RGB"
          git push origin HEAD:feature/snapmaker-rgb-display-v0125
