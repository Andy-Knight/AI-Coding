name: Validate Printer Fleet Controller v0.13.0

on:
  push:
    branches: [feature/bambu-lab-support-v0130]
    paths:
      - '.github/pfc-v0130-bambu-finalize.py'
      - '.github/pfc-v0130-fix-helper.py'
      - '.github/workflows/pfc-v0130-bambu.yml'

permissions:
  contents: write

jobs:
  test-and-finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/bambu-lab-support-v0130
          fetch-depth: 0
      - name: Apply v0.13.0 integration patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/pfc-v0130-bambu-finalize.py')
          text = p.read_text(encoding='utf-8')
          old = "including manual assignments for third-party filament; RFID data is used as fallback. Nozzle size and XYZ offset come directly from each physical U1 extruder."
          new = "including manual assignments for third-party filament; manually assigned filament colours can be written back to the idle printer. Official Snapmaker RFID colours remain locked. Nozzle size and XYZ offset come directly from each physical U1 extruder."
          if old not in text:
              raise SystemExit('U1 material-help finalizer anchor not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python .github/pfc-v0130-bambu-finalize.py
          python .github/pfc-v0130-fix-helper.py
      - name: Run full test suite
        working-directory: print-farm-controller
        run: |
          npm test | tee /tmp/pfc-tests.txt
          grep -q '# pass 133' /tmp/pfc-tests.txt
          grep -q '# fail 0' /tmp/pfc-tests.txt
      - name: Commit tested v0.13.0 update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pfc-v0130-bambu.yml .github/pfc-v0130-bambu-finalize.py .github/pfc-v0130-fix-helper.py
          git add print-farm-controller
          git commit -m 'Add Bambu Lab P1S P2S H2S H2D H2C support'
          git push origin HEAD:feature/bambu-lab-support-v0130
