name: Validate Printer Fleet Controller v0.12.4

on:
  push:
    branches:
      - feature/flashforge-filament-colour-v0124

permissions:
  contents: write

jobs:
  test-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/flashforge-filament-colour-v0124
          fetch-depth: 0

      - name: Apply v0.12.4 FlashForge filament colour update
        run: python .github/pfc-v0124-flashforge-colour.py

      - name: Run full test suite
        working-directory: print-farm-controller
        run: npm test

      - name: Commit tested v0.12.4 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pfc-v0124-flashforge-colour.yml .github/pfc-v0124-flashforge-colour.py
          git add print-farm-controller
          git commit -m "Add FlashForge filament colour designation"
          git push origin HEAD:feature/flashforge-filament-colour-v0124
