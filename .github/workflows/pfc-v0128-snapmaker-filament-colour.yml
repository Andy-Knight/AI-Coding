name: Validate Printer Fleet Controller v0.12.8

on:
  push:
    branches:
      - feature/snapmaker-native-filament-colour-v0128

permissions:
  contents: write

jobs:
  test-and-finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/snapmaker-native-filament-colour-v0128
          fetch-depth: 0

      - name: Apply v0.12.8 Snapmaker filament colour update
        run: python .github/pfc-v0128-snapmaker-filament-colour.py

      - name: Run full test suite
        working-directory: print-farm-controller
        run: |
          npm test | tee /tmp/pfc-tests.txt
          grep -q "# pass 125" /tmp/pfc-tests.txt
          grep -q "# fail 0" /tmp/pfc-tests.txt

      - name: Commit tested v0.12.8 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pfc-v0128-snapmaker-filament-colour.yml .github/pfc-v0128-snapmaker-filament-colour.py
          git add print-farm-controller
          git commit -m "Add native Snapmaker filament colour editing"
          git push origin HEAD:feature/snapmaker-native-filament-colour-v0128
