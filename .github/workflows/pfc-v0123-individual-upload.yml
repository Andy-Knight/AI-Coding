name: Validate Printer Fleet Controller v0.12.3

on:
  push:
    branches:
      - feature/individual-printer-upload-v0123

permissions:
  contents: write

jobs:
  test-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/individual-printer-upload-v0123
          fetch-depth: 0

      - name: Normalize README release-note patch target
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('print-farm-controller/README.md')
          text = path.read_text(encoding='utf-8')
          old = '> v0.12.2 adds **Reprint batch** to finished production batches in Recent history. Reprinting creates a new automatic production batch with the same quantity, staged G-code and print options while leaving the original history unchanged.\n'
          new = '> v0.12.2 adds **Reprint batch** to finished production batches in Recent history. Reprinting creates a new automatic production batch with the same quantity, staged controller file and print options while preserving the original history.\n'
          if old not in text:
              raise SystemExit('README v0.12.2 release note not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply v0.12.3 individual upload update
        run: python .github/pfc-v0123-individual-upload.py

      - name: Fix generated regression assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('print-farm-controller/test/file-distribution.test.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(r'/does not support \\.3mf uploads/', r'/does not support \.3mf uploads/')
          path.write_text(text, encoding='utf-8')
          path = Path('print-farm-controller/test/ui-print-setup.test.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(r'/\\.printer-file-upload/', r'/\.printer-file-upload/')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run full test suite
        working-directory: print-farm-controller
        run: npm test

      - name: Commit tested v0.12.3 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pfc-v0123-individual-upload.yml .github/workflows/pfc-v0123-individual-upload-retry.yml .github/pfc-v0123-individual-upload.py
          git add print-farm-controller
          git commit -m "Add individual printer file upload"
          git push origin HEAD:feature/individual-printer-upload-v0123
