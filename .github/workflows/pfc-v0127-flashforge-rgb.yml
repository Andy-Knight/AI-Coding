name: Validate Printer Fleet Controller v0.12.7

on:
  push:
    branches:
      - feature/flashforge-rgb-display-v0127

permissions:
  contents: write

jobs:
  test-and-finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/flashforge-rgb-display-v0127
          fetch-depth: 0

      - name: Apply v0.12.7 FlashForge RGB display update
        run: python .github/pfc-v0127-flashforge-rgb.py

      - name: Run full test suite
        working-directory: print-farm-controller
        run: npm test

      - name: Commit tested v0.12.7 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pfc-v0127-flashforge-rgb.yml .github/pfc-v0127-flashforge-rgb.py
          git add print-farm-controller
          git commit -m "Show FlashForge filament colours in RGB"
          git push origin HEAD:feature/flashforge-rgb-display-v0127
