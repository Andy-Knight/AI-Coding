name: Apply Printer Fleet Controller v0.12.0

on:
  push:
    branches:
      - feature/production-batch-queue-v0120

permissions:
  contents: write

jobs:
  apply-test-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/production-batch-queue-v0120
          fetch-depth: 0

      - name: Apply production batch queue changes
        run: |
          python - <<'PY'
