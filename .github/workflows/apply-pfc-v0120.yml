    printerId: null,
    printerName: 'Next available compatible printer',
    productionSequence: sequence,
    productionQuantity: quantity,
    productionPaused: paused,
    compatibility: null,
    options: { ...sanitizeOptions(template.options), toolMap:null, usedLogicalTools:[] },
    toolSnapshot: [],
    status: 'queued',
    queuedAt: timestamp,
    startRequestedAt: null,
    startedAt: null,
    finishedAt: null,
    updatedAt: timestamp,
    error: null,
    maxProgress: 0,
    lastPrinterState: null,
    bedClearanceRequired: false,
    bedClearedAt: null
  };
}
'''
          if helper_anchor not in text: raise SystemExit('helper anchor not found')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

