name: Apply Printer Fleet Controller v0.12.0

on:
  push:
    branches:
      - feature/production-batch-queue-v0120

permissions:
  contents: write

jobs:
  apply-test-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/production-batch-queue-v0120
          fetch-depth: 0

      - name: Apply v0.12.0 production batch changes
        run: python .github/pfc-v0120.py

      - name: Run full test suite
        working-directory: print-farm-controller
        run: npm test

      - name: Commit tested v0.12.0 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pfc-v0120.yml .github/pfc-v0120.py
          git add print-farm-controller
          git commit -m "Add production batch queue v0.12.0"
          git push origin HEAD:feature/production-batch-queue-v0120
