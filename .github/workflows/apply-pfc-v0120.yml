  const cleared = event.target.closest('[data-bed-cleared]');
'''
          if listener_anchor not in text: raise SystemExit('queue active listener anchor not found')
          text = text.replace(listener_anchor, listener_new, 1)
          app.write_text(text)

          styles = Path('print-farm-controller/public/styles.css')
          text = styles.read_text()
          addition = r'''

/* Production quantity / batch queue */
.production-batch { border-left:4px solid currentColor; }
.production-batch.production-paused { opacity:.9; }
.production-counts { margin-top:6px; font-size:.9rem; }
.production-progress { height:7px; margin-top:9px; border-radius:999px; overflow:hidden; background:rgba(127,127,127,.22); }
.production-progress > span { display:block; height:100%; background:currentColor; transition:width .2s ease; }
.production-runs { margin-top:10px; display:grid; gap:5px; }
.production-run { display:flex; justify-content:space-between; gap:12px; font-size:.82rem; padding:5px 0; border-top:1px solid rgba(127,127,127,.18); }
.production-run span:last-child { text-align:right; opacity:.78; }
.production-actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.production-quantity-control { display:flex; align-items:center; gap:6px; font-size:.82rem; }
.production-quantity-control input { width:76px; }
@media (max-width:760px) { .production-run { flex-direction:column; gap:2px; } .production-run span:last-child { text-align:left; } }
'''
          if '/* Production quantity / batch queue */' not in text:
              text += addition
          styles.write_text(text)

          package = Path('print-farm-controller/package.json')
          text = package.read_text()
          if '"version": "0.11.3"' not in text: raise SystemExit('package version anchor not found')
          package.write_text(text.replace('"version": "0.11.3"', '"version": "0.12.0"', 1))

          readme = Path('print-farm-controller/README.md')
          text = readme.read_text()
          text = text.replace('# Printer Fleet Controller v0.11.3', '# Printer Fleet Controller v0.12.0', 1)
          marker = '> v0.11.3 makes **Clear history** immediately delete controller-staged queue files that are no longer referenced.'
          intro = '> v0.12.0 adds **production quantity / batch printing**. A single staged G-code can represent 2–999 copies, with copies automatically distributed across compatible idle printers. Production batches expose overall progress, per-copy printer/status, pause/resume, cancel remaining copies, and safe quantity changes while retaining existing bed-clearance and preflight protections.\n\n'
          if intro.strip() not in text:
              if marker not in text: raise SystemExit('README release anchor not found')
              text = text.replace(marker, intro + marker, 1)
          readme.write_text(text)

          context = Path('print-farm-controller/PROJECT_CONTEXT.md')
          text = context.read_text()
          text = text.replace('Current application version: **0.11.3**', 'Current application version: **0.12.0**')
          marker = '- **v0.11.3 staged-file cleanup:** clearing print history immediately removes controller-staged queue files that have no remaining queue/history reference; shared/referenced files are retained.\n'
          completed = '- **v0.12.0 production quantity / batch printing:** one staged G-code can create 2–999 run records sharing the same file; automatic scheduling can distribute copies across multiple compatible printers concurrently, with batch progress, pause/resume, cancel remaining, and safe quantity adjustment.\n'
          if completed not in text:
              if marker not in text: raise SystemExit('PROJECT_CONTEXT completed marker not found')
              text = text.replace(marker, marker + completed, 1)
          start = text.index('## Current task')
          end = text.index('## Next steps')
          text = text[:start] + '''## Current task\n\n**v0.12.0 implementation is complete in code and automated tests.** Next priority is real-hardware validation of production quantities across mixed FlashForge/Snapmaker printers, especially concurrent assignment, bed-clearance recycling, printer-local file reuse, and pause/resume behaviour.\n\n''' + text[end:]
          next_start = text.index('## Next steps')
          handoff = text.index('## Handoff rule')
          text = text[:next_start] + '''## Next steps\n\n1. Queue a known-good single-tool file with quantity 4 or more and confirm multiple compatible printers receive copies concurrently.\n2. Confirm each completed printer waits for **Bed cleared** before it receives the next copy from the same production batch.\n3. Pause a production batch while copies are active and confirm active prints continue but no new copies start; then resume it.\n4. Increase and decrease the requested quantity while copies are waiting and confirm already-started/finished copies are never removed.\n5. Cancel remaining copies and confirm currently active prints continue while all waiting copies are cancelled.\n6. Confirm a printer that already has the exact filename reuses its printer-local copy rather than uploading it again.\n7. After hardware validation, consider queue priority / scheduling policy as the next scheduler milestone.\n\n''' + text[handoff:]
          context.write_text(text)
          PY

      - name: Add production batch regression tests
        run: |
          cat >> print-farm-controller/test/print-queue.test.js <<'EOF'

          test('automatic production quantity creates shared staged runs and fills multiple compatible printers', async () => {
            const fleetState = new FakeFleetState([
              { id:'p1', name:'Printer 1', online:true, status:{ status:'idle', fileName:null, tools:[{ index:0, filament:{} }] } },
              { id:'p2', name:'Printer 2', online:true, status:{ status:'idle', fileName:null, tools:[{ index:0, filament:{} }] } }
            ]);
            const store = memoryStore();
            const staged = {
              id:'66666666-6666-4666-8666-666666666666', fileName:'batch.gcode', filePath:'/staged/batch.gcode', size:10, sha256:'d'.repeat(64), stagedAt:new Date().toISOString(),
              requirements:{ requiredTools:[0], toolCount:1, usageReliable:true, logicalTools:[{ index:0 }], materialMetadata:{ metadataAvailable:false, requiredMaterial:null, materials:[] } }
            };
            const uploaded = new Set();
            const starts = [];
            const service = new PrintQueueService({
              fleetState,
              chamberPreheat:{ isActive:() => false, stop:async () => {} },
              getPrinterFn:async (id) => ({ id, name:id === 'p1' ? 'Printer 1' : 'Printer 2' }),
              adapterResolver:(printer) => ({
                capabilities:{ fileUpload:true, localFiles:true, printLocalFile:true }, limits:{ toolCount:1 }, uploadExtensions:['.gcode'],
                getStatus:async () => fleetState.getPrinterState(printer.id).status,
                verifyFile:async () => ({ verified:uploaded.has(printer.id), source:'test' }),
                uploadFile:async () => { uploaded.add(printer.id); },
                printLocalFile:async (fileName) => { starts.push({ id:printer.id, fileName }); }
              }),
              loadJobsFn:store.load,
              saveJobsFn:store.save,
              getQueueFileFn:async () => staged,
              pruneQueueFilesFn:async () => 0,
              saveFileMaterialMetadataFn:async () => {}
            });
            await service.start();
            const first = await service.add({ assignmentMode:'automatic', stagedFileId:staged.id, quantity:3 });
            await waitFor(() => starts.length === 2);
            const snapshot = service.getSnapshot();
            const batch = snapshot.productionBatches.find((item) => item.id === first.productionBatchId);
            assert.ok(batch);
            assert.equal(batch.quantity, 3);
            assert.equal(batch.runs.length, 3);
            assert.equal(new Set(snapshot.jobs.filter((job) => job.productionBatchId === batch.id).map((job) => job.stagedFile.id)).size, 1);
            assert.deepEqual(new Set(starts.map((item) => item.id)), new Set(['p1','p2']));
            service.stop();
          });

          test('production batch can pause, change waiting quantity, resume and cancel remaining copies', async () => {
            const store = memoryStore();
            const staged = {
              id:'77777777-7777-4777-8777-777777777777', fileName:'production.gcode', filePath:'/staged/production.gcode', size:10, sha256:'e'.repeat(64), stagedAt:new Date().toISOString(),
              requirements:{ requiredTools:[0], toolCount:1, usageReliable:true, logicalTools:[{ index:0 }], materialMetadata:{ metadataAvailable:false, materials:[] } }
            };
            const service = new PrintQueueService({
              fleetState:new FakeFleetState([]),
              chamberPreheat:{ isActive:() => false, stop:async () => {} },
              loadJobsFn:store.load,
              saveJobsFn:store.save,
              getQueueFileFn:async () => staged,
              pruneQueueFilesFn:async () => 0
            });
            await service.start();
            const first = await service.add({ assignmentMode:'automatic', stagedFileId:staged.id, quantity:3 });
            const batchId = first.productionBatchId;
            await service.pauseProduction(batchId);
            assert.equal(service.getSnapshot().productionBatches[0].paused, true);
            await service.setProductionQuantity(batchId, 5);
            assert.equal(service.getSnapshot().productionBatches[0].quantity, 5);
            assert.equal(service.getSnapshot().productionBatches[0].runs.length, 5);
            await service.setProductionQuantity(batchId, 2);
            assert.equal(service.getSnapshot().productionBatches[0].runs.length, 2);
            await service.resumeProduction(batchId);
            assert.equal(service.getSnapshot().productionBatches[0].paused, false);
            const result = await service.cancelProduction(batchId);
            assert.equal(result.cancelled, 2);
            assert.equal(service.getSnapshot().productionBatches[0].cancelled, 2);
            service.stop();
          });

          test('clear history retains completed production runs while sibling copies are still pending', async () => {
            const batchId = '88888888-8888-4888-8888-888888888888';
            const stagedFile = { id:'99999999-9999-4999-8999-999999999999', fileName:'batch.gcode' };
            const store = memoryStore([
              { id:'done', productionBatchId:batchId, productionSequence:1, productionQuantity:2, assignmentMode:'automatic', printerId:'p1', printerName:'Printer', fileName:'batch.gcode', stagedFile, status:'completed', options:{}, queuedAt:'2026-09-11T10:00:00.000Z', updatedAt:'2026-09-11T10:30:00.000Z', finishedAt:'2026-09-11T10:30:00.000Z', bedClearanceRequired:false },
              { id:'waiting', productionBatchId:batchId, productionSequence:2, productionQuantity:2, assignmentMode:'automatic', printerId:null, printerName:'Next available compatible printer', fileName:'batch.gcode', stagedFile, status:'queued', options:{}, queuedAt:'2026-09-11T10:01:00.000Z', updatedAt:'2026-09-11T10:01:00.000Z', bedClearanceRequired:false }
            ]);
            const service = new PrintQueueService({
              fleetState:new FakeFleetState([]),
              chamberPreheat:{ isActive:() => false, stop:async () => {} },
              loadJobsFn:store.load,
              saveJobsFn:store.save,
              pruneQueueFilesFn:async () => 0
            });
            await service.start();
            assert.equal(await service.clearHistory(), 0);
            assert.equal(service.getSnapshot().productionBatches[0].completed, 1);
            assert.equal(service.getSnapshot().productionBatches[0].queued, 1);
            service.stop();
          });
          EOF

          cat >> print-farm-controller/test/ui-print-setup.test.js <<'EOF'

          test('queue UI exposes production quantity and batch controls', () => {
            const html = fs.readFileSync(new URL('../public/index.html', import.meta.url), 'utf8');
            const server = fs.readFileSync(new URL('../src/server.js', import.meta.url), 'utf8');
            const queue = fs.readFileSync(new URL('../src/print-queue.js', import.meta.url), 'utf8');
            assert.match(html, /id="queueAddQuantity"/);
            assert.match(html, /Quantity 2 or more creates one production batch/);
            assert.match(app, /productionBatchMarkup/);
            assert.match(app, /Pause production/);
            assert.match(app, /Cancel remaining/);
            assert.match(app, /data-production-quantity/);
            assert.match(server, /queue\\/production/);
            assert.match(queue, /pauseProduction/);
            assert.match(queue, /setProductionQuantity/);
            assert.match(queue, /productionBatches/);
            assert.match(styles, /\.production-progress/);
          });
          EOF

