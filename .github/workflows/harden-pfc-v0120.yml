name: Harden Printer Fleet Controller v0.12.0

on:
  push:
    branches:
      - feature/production-batch-queue-v0120

permissions:
  contents: write

jobs:
  harden-test-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/production-batch-queue-v0120
          fetch-depth: 0

      - name: Apply production race hardening
        run: |
          python .github/pfc-v0120-hardening.py
          python .github/pfc-v0120-hardening-fix.py

      - name: Run full test suite
        working-directory: print-farm-controller
        run: npm test

      - name: Commit tested hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harden-pfc-v0120.yml .github/pfc-v0120-hardening.py .github/pfc-v0120-hardening-fix.py
          git add print-farm-controller
          git commit -m "Harden production pause and cancel races"
          git push origin HEAD:feature/production-batch-queue-v0120
