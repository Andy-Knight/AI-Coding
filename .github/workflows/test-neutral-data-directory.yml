name: Validate Printer Fleet Controller v0.11.2

on:
  push:
    branches:
      - feature/neutral-data-directory

permissions:
  contents: write

jobs:
  test-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/neutral-data-directory
          fetch-depth: 0

      - name: Update release documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path('print-farm-controller/README.md')
          readme = readme_path.read_text()
          readme = readme.replace('# Printer Fleet Controller v0.11.1', '# Printer Fleet Controller v0.11.2', 1)
          marker = '> v0.11.1 adds a persistent **Controller nozzle designation** for FlashForge 5M-family printers.'
          intro = '> v0.11.2 moves the default controller application-data directory to a manufacturer-neutral **Printer Fleet Controller** path. Existing data is migrated automatically from the historical `FlashForge Fleet` directory on first startup, including printer configuration, queue/history, staged queue files, and material metadata. Custom `DATA_DIR` locations are unchanged.\n\n'
          if intro.strip() not in readme:
              readme = readme.replace(marker, intro + marker, 1)
          readme = readme.replace(
              'The application is now named **Printer Fleet Controller**. Existing installations continue to use the legacy application-data directory so upgrades do not lose already configured printers.',
              'The application is named **Printer Fleet Controller**. From v0.11.2 the default application-data directory is manufacturer-neutral; existing installations are migrated automatically from the historical FlashForge-named directory so configured printers and queued work are retained.'
          )
          readme = readme.replace(
              'Existing configuration remains in the same legacy location as earlier versions so upgrades do not require re-adding printers. The historical `Print Controller/FlashForge Fleet` directory name is intentionally retained for backward compatibility. Queue/history is stored in `print-jobs.json`, and remembered per-printer file material metadata is stored in `file-material-metadata.json` in the same directory.',
              'The default application-data directory is now manufacturer-neutral. On first v0.11.2 startup, if the new directory does not yet exist but the historical `FlashForge Fleet` directory does, the controller migrates the complete directory before fleet and queue startup. That preserves `printers.json`, `print-jobs.json`, `file-material-metadata.json`, staged `queue-files/`, and other controller state. A custom `DATA_DIR` is used exactly as configured and is not migrated.'
          )
          readme = readme.replace(r'%LOCALAPPDATA%\Print Controller\FlashForge Fleet\printers.json', r'%LOCALAPPDATA%\Print Controller\Printer Fleet Controller\printers.json')
          readme = readme.replace('~/Library/Application Support/Print Controller/FlashForge Fleet/printers.json', '~/Library/Application Support/Print Controller/Printer Fleet Controller/printers.json')
          readme = readme.replace('~/.local/share/print-controller/flashforge-fleet/printers.json', '~/.local/share/print-controller/printer-fleet-controller/printers.json')
          readme_path.write_text(readme)

          context_path = Path('print-farm-controller/PROJECT_CONTEXT.md')
          context = context_path.read_text()
          context = context.replace('Current application version: **0.11.1**', 'Current application version: **0.11.2**')
          context = context.replace(
              '- Preserve the legacy application-data directory for upgrade compatibility.',
              '- Default application data uses the manufacturer-neutral `Printer Fleet Controller` directory. v0.11.2 automatically migrates the complete historical `FlashForge Fleet` directory on first startup; custom `DATA_DIR` locations are never moved.'
          )
          completed_marker = '- v0.11.1 regression suite: **105 passing tests, 0 failures**, including GitHub Actions verification.\n'
          completed_add = '- **v0.11.2 neutral data directory:** default controller storage no longer contains `FlashForge`; existing printer registry, queue/history, staged queue files, and metadata migrate automatically to the new manufacturer-neutral directory.\n'
          if completed_add not in context:
              context = context.replace(completed_marker, completed_marker + completed_add)
          context = context.replace(
              '**v0.11.1 implementation is complete in code and automated tests.** Next priority is real-hardware validation of the **Next available compatible printer** workflow, including the new FlashForge controller nozzle designation, on the user\'s configured FlashForge and Snapmaker fleet.',
              '**v0.11.2 implementation is complete in code and automated tests.** Next priority is real-hardware validation of the **Next available compatible printer** workflow and confirmation that the one-time application-data migration preserves the user\'s configured fleet and queued files.'
          )
          context = context.replace('1. Deploy/run v0.11.1 and queue', '1. Deploy/run v0.11.2, confirm the legacy application data migrated to the neutral directory, then queue')
          context_path.write_text(context)
          PY

      - name: Run full test suite
        working-directory: print-farm-controller
        run: npm test

      - name: Commit tested v0.11.2 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/test-neutral-data-directory.yml
          git add print-farm-controller/README.md print-farm-controller/PROJECT_CONTEXT.md
          git commit -m "Finalize neutral data directory v0.11.2"
          git push origin HEAD:feature/neutral-data-directory
