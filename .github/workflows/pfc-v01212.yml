name: Validate Printer Fleet Controller v0.12.12

on:
  push:
    branches: [fix/queue-new-job-progress-v01212]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: print-farm-controller
    steps:
      - name: Check out v0.12.12 fix
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run full test suite
        run: |
          npm test | tee /tmp/pfc-tests.txt
          grep -q '# pass 131' /tmp/pfc-tests.txt
          grep -q '# fail 0' /tmp/pfc-tests.txt
